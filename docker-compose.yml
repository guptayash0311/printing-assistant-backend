services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: print
      POSTGRES_PASSWORD: print
      POSTGRES_DB: print
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U print -d print"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://print:print@postgres:5432/print
      REDIS_URL: redis://redis:6379/0
      STORAGE_ROOT: /data/files
      JWT_SECRET: dev-only-change-me
      CORS_ORIGINS: http://localhost:5173
      SUPER_ADMIN_EMAIL: admin@example.com
      SUPER_ADMIN_PASSWORD: change-me-please
      SEED_SUPER_ADMIN: "true"
      INLINE_FILE_PROCESSING: "false"
      AUTO_CREATE_SCHEMA: "false"
    volumes:
      - filedata:/data/files
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build: .
    command: sh -c "alembic upgrade head && python -m app.workers.file_worker"
    environment:
      DATABASE_URL: postgresql+psycopg://print:print@postgres:5432/print
      REDIS_URL: redis://redis:6379/0
      STORAGE_ROOT: /data/files
      INLINE_FILE_PROCESSING: "false"
      AUTO_CREATE_SCHEMA: "false"
    volumes:
      - filedata:/data/files
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  pgdata:
  filedata:
